---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 07-openshell-keycloak
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openshell-agents
  source:
    repoURL: REPO_URL_PLACEHOLDER
    targetRevision: main
    path: applications/openshell-keycloak/base
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - Validate=true
