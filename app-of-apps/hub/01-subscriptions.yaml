---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 01-subscriptions
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: REPO_URL_PLACEHOLDER
    targetRevision: main
    path: applications/subscriptions
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - Validate=true
