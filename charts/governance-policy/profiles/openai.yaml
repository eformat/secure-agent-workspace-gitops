display_name: OpenAI-compatible APIs
description: OpenAI-compatible REST API access (MaaS, OpenAI, OpenRouter)
provider_type: openai
credentials:
  - name: api_key
    description: OpenAI-compatible API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: maas.apps.ocp.cloud.rhai-tmm.dev
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-write
  - host: api.openai.com
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-write
  - host: openrouter.ai
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-write
binaries:
  - /usr/bin/codex
  - /usr/local/bin/codex
