suite: Test external-secrets cluster secret store
templates:
  - templates/vault/external-secrets-hub-secretstore.yaml
release:
  name: release-test
tests:
  - it: should output nothing if .Value.global.secretStore is not "vault"
    set:
      global:
        secretStore:
          backend: "kubernetes"
    asserts:
      - hasDocuments:
          count: 0

  - it: should output things if the backend is not set (we assume vault as a default)
    set:
      global:
        secretStore:
          backend: null
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: ClusterSecretStore
          apiVersion: external-secrets.io/v1
          name: vault-backend

  - it: should output things if the backend is set to vault
    set:
      global:
        secretStore:
          backend: "vault"
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: ClusterSecretStore
          apiVersion: external-secrets.io/v1
          name: vault-backend

  - it: should set the vault server to the hubClusterDomain
    set:
      global:
        hubClusterDomain: foo.bar.baz
    asserts:
      - equal:
          path: spec.provider.vault.server
          value: "https://vault-vault.foo.bar.baz"

  - it: should use ocpExternalSecrets.vault.externalAddress when set
    set:
      global:
        hubClusterDomain: ignored.hub.example.com
      ocpExternalSecrets:
        vault:
          externalAddress: "https://vault.external.example:8200"
          external:
            secretRef:
              name: external-auth
              namespace: external-secrets
              key: token
    asserts:
      - equal:
          path: spec.provider.vault.server
          value: "https://vault.external.example:8200"

  - it: should use hub vault URL when externalAddress is empty
    set:
      global:
        hubClusterDomain: my.hub.domain
      ocpExternalSecrets:
        vault:
          externalAddress: ""
    asserts:
      - equal:
          path: spec.provider.vault.server
          value: "https://vault-vault.my.hub.domain"

  - it: should ignore vault.external when externalAddress is empty
    set:
      global:
        hubClusterDomain: my.hub.domain
      clusterGroup:
        isHubCluster: true
      ocpExternalSecrets:
        rbac:
          rolename: hub-role
        vault:
          externalAddress: ""
          external:
            kvPath: custom-kv
            kvVersion: v1
            kubernetesMountPath: custom-mount
            kubernetesRole: custom-role
          mountPath: hub
    asserts:
      - equal:
          path: spec.provider.vault.path
          value: secret
      - equal:
          path: spec.provider.vault.version
          value: v2
      - equal:
          path: spec.provider.vault.auth.kubernetes.mountPath
          value: hub
      - equal:
          path: spec.provider.vault.auth.kubernetes.role
          value: hub-role

  - it: should apply vault.external KV settings when externalAddress is set
    set:
      ocpExternalSecrets:
        vault:
          externalAddress: "https://vault.external.example:8200"
          external:
            kvPath: team-secrets
            kvVersion: v1
            secretRef:
              name: external-auth
              namespace: external-secrets
              key: token
    asserts:
      - equal:
          path: spec.provider.vault.server
          value: "https://vault.external.example:8200"
      - equal:
          path: spec.provider.vault.path
          value: team-secrets
      - equal:
          path: spec.provider.vault.version
          value: v1

  - it: should use default KV path and version for external vault when external.kvPath and kvVersion are empty
    set:
      ocpExternalSecrets:
        vault:
          externalAddress: "https://vault.external.example:8200"
          external:
            kvPath: ""
            kvVersion: ""
            secretRef:
              name: external-auth
              namespace: external-secrets
              key: token
    asserts:
      - equal:
          path: spec.provider.vault.path
          value: secret
      - equal:
          path: spec.provider.vault.version
          value: v2

  - it: should use vault.external kubernetes auth when externalAddress and both mount and role are set
    set:
      ocpExternalSecrets:
        vault:
          externalAddress: "https://vault.external.example:8200"
          external:
            kubernetesMountPath: ocp/kubernetes/prod
            kubernetesRole: eso-external-role
            secretRef:
              name: external-auth
              namespace: external-secrets
              key: token
    asserts:
      - equal:
          path: spec.provider.vault.auth.kubernetes.mountPath
          value: ocp/kubernetes/prod
      - equal:
          path: spec.provider.vault.auth.kubernetes.role
          value: eso-external-role

  - it: should fall back to hub kubernetes auth when external vault omits external kubernetes mount or role
    set:
      clusterGroup:
        isHubCluster: true
      ocpExternalSecrets:
        rbac:
          rolename: hub-rolename
        vault:
          externalAddress: "https://vault.external.example:8200"
          external:
            kubernetesMountPath: ""
            kubernetesRole: ""
            secretRef:
              name: external-auth
              namespace: external-secrets
              key: token
          mountPath: hub-mount
    asserts:
      - equal:
          path: spec.provider.vault.auth.kubernetes.mountPath
          value: hub-mount
      - equal:
          path: spec.provider.vault.auth.kubernetes.role
          value: hub-rolename

  - it: should not use partial external kubernetes auth when only mountPath is set
    set:
      clusterGroup:
        isHubCluster: true
      ocpExternalSecrets:
        rbac:
          rolename: hub-rolename
        vault:
          externalAddress: "https://vault.external.example:8200"
          external:
            kubernetesMountPath: partial-mount
            kubernetesRole: ""
            secretRef:
              name: external-auth
              namespace: external-secrets
              key: token
          mountPath: hub-mount
    asserts:
      - equal:
          path: spec.provider.vault.auth.kubernetes.mountPath
          value: hub-mount
      - equal:
          path: spec.provider.vault.auth.kubernetes.role
          value: hub-rolename

  - it: should fall back to spoke kubernetes auth for external vault when external k8s auth is not set
    set:
      global:
        clusterDomain: spoke.example.org
      clusterGroup:
        isHubCluster: false
      ocpExternalSecrets:
        vault:
          externalAddress: "https://vault.external.example:8200"
          external:
            kubernetesMountPath: ""
            kubernetesRole: ""
            secretRef:
              name: external-auth
              namespace: external-secrets
              key: token
    asserts:
      - equal:
          path: spec.provider.vault.auth.kubernetes.mountPath
          value: spoke.example.org
      - equal:
          path: spec.provider.vault.auth.kubernetes.role
          value: spoke.example.org-role

  - it: should use external secretRef when externalAddress is set
    set:
      ocpExternalSecrets:
        vault:
          externalAddress: "https://vault.external.example:8200"
          external:
            secretRef:
              name: external-auth
              namespace: external-secrets
              key: vault-token
    asserts:
      - equal:
          path: spec.provider.vault.auth.kubernetes.secretRef.name
          value: external-auth
      - equal:
          path: spec.provider.vault.auth.kubernetes.secretRef.namespace
          value: external-secrets
      - equal:
          path: spec.provider.vault.auth.kubernetes.secretRef.key
          value: vault-token

  - it: should use arbitrary external auth provider settings when externalAddress is set
    set:
      ocpExternalSecrets:
        vault:
          externalAddress: "https://vault.external.example:8200"
          external:
            auth:
              appRole:
                path: approle
                roleRef:
                  name: vault-approle
                  key: role-id
                secretRef:
                  name: vault-approle
                  key: secret-id
    asserts:
      - equal:
          path: spec.provider.vault.auth.appRole.path
          value: approle
      - equal:
          path: spec.provider.vault.auth.appRole.roleRef.name
          value: vault-approle
      - equal:
          path: spec.provider.vault.auth.appRole.roleRef.key
          value: role-id
      - equal:
          path: spec.provider.vault.auth.appRole.secretRef.name
          value: vault-approle
      - equal:
          path: spec.provider.vault.auth.appRole.secretRef.key
          value: secret-id
      - notExists:
          path: spec.provider.vault.auth.kubernetes

  - it: should set secretRef with default values
    asserts:
      - equal:
          path: spec.provider.vault.auth.kubernetes.secretRef.name
          value: ocp-external-secrets
      - equal:
          path: spec.provider.vault.auth.kubernetes.secretRef.namespace
          value: external-secrets
      - equal:
          path: spec.provider.vault.auth.kubernetes.secretRef.key
          value: token

  - it: should use configurable serviceAccount in secretRef
    set:
      ocpExternalSecrets:
        rbac:
          serviceAccount:
            name: "custom-sa"
            namespace: "custom-namespace"
    asserts:
      - equal:
          path: spec.provider.vault.auth.kubernetes.secretRef.name
          value: custom-sa
      - equal:
          path: spec.provider.vault.auth.kubernetes.secretRef.namespace
          value: custom-namespace
      - equal:
          path: spec.provider.vault.auth.kubernetes.secretRef.key
          value: token

  - it: should not set the caProvider when disabled
    set:
      ocpExternalSecrets:
        caProvider:
          enabled: false
    asserts:
      - notExists:
          path: spec.provider.vault.caProvider

  - it: should set the caProvider to the hostCluster when on the hub
    set:
      clusterGroup:
        isHubCluster: true
      ocpExternalSecrets:
        caProvider:
          hostCluster:
            name: foo-bar-configmap
            key: foo-key
            namespace: foo
    asserts:
      - equal:
          path: spec.provider.vault.caProvider.type
          value: ConfigMap
      - equal:
          path: spec.provider.vault.caProvider.name
          value: foo-bar-configmap
      - equal:
          path: spec.provider.vault.caProvider.key
          value: foo-key
      - equal:
          path: spec.provider.vault.caProvider.namespace
          value: foo

  - it: should set the caProvider to the hostCluster when hashicorp-vault is set but isHubCluster is false
    set:
      clusterGroup:
        isHubCluster: false
        applications:
          acm:
            name: acm
            namespace: open-cluster-management
            project: hub
            chart: acm
            chartVersion: 0.1.*
            ignoreDifferences:
              - group: internal.open-cluster-management.io
                kind: ManagedClusterInfo
                jsonPointers:
                  - /spec/loggingCA
          vault:
            name: vault
            namespace: vault
            project: hub
            chart: hashicorp-vault
            chartVersion: 0.1.*
      ocpExternalSecrets:
        caProvider:
          hostCluster:
            name: bar-bar-configmap
            key: bar-key
            namespace: bar
    asserts:
      - equal:
          path: spec.provider.vault.caProvider.type
          value: ConfigMap
      - equal:
          path: spec.provider.vault.caProvider.name
          value: bar-bar-configmap
      - equal:
          path: spec.provider.vault.caProvider.key
          value: bar-key
      - equal:
          path: spec.provider.vault.caProvider.namespace
          value: bar

  - it: should set the caProvider to the clientCluster when not on the hub
    set:
      clusterGroup:
        isHubCluster: false
      ocpExternalSecrets:
        caProvider:
          clientCluster:
            name: foo-bar-configmap
            key: foo-key
            namespace: foo
    asserts:
      - equal:
          path: spec.provider.vault.caProvider.type
          value: Secret
      - equal:
          path: spec.provider.vault.caProvider.name
          value: foo-bar-configmap
      - equal:
          path: spec.provider.vault.caProvider.key
          value: foo-key
      - equal:
          path: spec.provider.vault.caProvider.namespace
          value: foo

  - it: should set the kubernetes auth when on the hub
    set:
      clusterGroup:
        isHubCluster: true
      ocpExternalSecrets:
        rbac:
          rolename: "hub-rolename"
        vault:
          mountPath: "hub-mount"
    asserts:
      - equal:
          path: spec.provider.vault.auth.kubernetes.mountPath
          value: hub-mount
      - equal:
          path: spec.provider.vault.auth.kubernetes.role
          value: hub-rolename

  - it: should set the kubernetes auth when not on the hub
    set:
      global:
        clusterDomain: foo.bar
      clusterGroup:
        isHubCluster: false
    asserts:
      - equal:
          path: spec.provider.vault.auth.kubernetes.mountPath
          value: foo.bar
      - equal:
          path: spec.provider.vault.auth.kubernetes.role
          value: foo.bar-role
