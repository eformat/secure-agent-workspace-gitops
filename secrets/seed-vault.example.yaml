---
# Seed template for vault (KV v2) - copied/edited to secrets/seed-vault.yaml
# (gitignored) or fed via environment variables. Keys match the ExternalSecret
# remoteRefs in charts/pattern-secrets (vaultPrefix: secret/data/hub).

ssh:
  private_key_path: ~/.generated-ssh-keys/sandbox-ssh
  public_key_path: ~/.generated-ssh-keys/sandbox-ssh.pub

inference:
  provider: gemini
  model: gemini-2.5-flash
  api_key_path: ~/.gemini-api-key

web_search:
  provider: none
