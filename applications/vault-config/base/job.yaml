---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-config
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: vault-config
      restartPolicy: OnFailure
      containers:
        - name: vault-config
          image: hashicorp/vault:1.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/configure.sh"]
          env:
            - name: VAULT_ADDR
              value: https://vault.vault.svc.cluster.local:8200
            - name: VAULT_CACERT
              value: /var/run/vault-ca/service-ca.crt
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: policy
              mountPath: /policy
              readOnly: true
            - name: vault-ca
              mountPath: /var/run/vault-ca
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: vault-config-scripts
            defaultMode: 0755
        - name: policy
          configMap:
            name: vault-config-scripts
            items:
              - key: hub.hcl
                path: hub.hcl
        - name: vault-ca
          configMap:
            name: service-ca.crt
